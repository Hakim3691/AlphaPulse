name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        type: choice
        default: 'debug'
        options:
          - debug
          - release
          - both
      run_tests:
        description: 'Run Unit & Robolectric Tests'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1: Test Suite (Gating matrix)
  # =========================================================================
  test:
    name: Unit Tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
    strategy:
      fail-fast: true
      matrix:
        api-level: [33, 34]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Gradle Memory & Performance Options
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' >> ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
          org.gradle.parallel=true
          org.gradle.configuration-cache=true
          EOF

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd975f78077227923285f433e6574f90f169b7f16" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses || true

      - name: Provision Secrets & Keystores (Test Environment)
        run: |
          # 1. Satisfy Secrets Gradle Plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 2. Make gradlew executable
          chmod +x gradlew

          # 3. Provision debug.keystore
          if [ ! -s debug.keystore ]; then
            if [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            fi
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug, O=Android, C=US"
          fi

          # 4. Provision fallback upload keystore
          if [ ! -s my-upload-key.jks ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Alpha Pulse, OU=Engineering, O=Alpha Pulse, L=Mountain View, ST=CA, C=US"
          fi

      - name: Execute Unit & Robolectric Tests
        run: |
          echo "Running unit & Robolectric tests (API Level: ${{ matrix.api-level }})..."
          ./gradlew :app:testDebugUnitTest --continue -Ptest.api.level=${{ matrix.api-level }} --stacktrace

      - name: Surface Test Failures in Job Summary
        if: failure()
        run: |
          echo "### ❌ Failed Tests (API ${{ matrix.api-level }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          FAILED_TESTS=$(find app/build/test-results -name "*.xml" -exec grep -H "<failure" {} + 2>/dev/null || true)

          if [ -n "$FAILED_TESTS" ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            find app/build/test-results -name "*.xml" -exec grep -B 1 -A 2 "<failure" {} + 2>/dev/null | sed 's/<[^>]*>//g' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "Tests failed during Gradle configuration or compilation. Inspect raw step logs above." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Test Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-api-${{ matrix.api-level }}-${{ github.sha }}
          path: app/build/**/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 14

  # =========================================================================
  # JOB 2: Build & Package APK (Only runs if ALL test jobs succeed)
  # =========================================================================
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Gradle Memory & Performance Options
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' >> ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
          org.gradle.parallel=true
          org.gradle.configuration-cache=true
          EOF

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd975f78077227923285f433e6574f90f169b7f16" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses || true

      - name: Provision Secrets & Keystores
        run: |
          # 1. Ensure .env exists to satisfy Secrets Gradle Plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 2. Make gradlew executable
          chmod +x gradlew

          # 3. Provision debug.keystore
          if [ ! -s debug.keystore ]; then
            if [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
              echo "Decoding debug.keystore from base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            fi
          fi
          if [ ! -s debug.keystore ]; then
            echo "Generating fresh standard debug.keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug, O=Android, C=US"
          fi

          # 4. Provision release upload keystore (my-upload-key.jks)
          if [ ! -s my-upload-key.jks ]; then
            echo "Generating fallback upload keystore (my-upload-key.jks)..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Alpha Pulse, OU=Engineering, O=Alpha Pulse, L=Mountain View, ST=CA, C=US"
          fi

      - name: Build APK Packages
        run: |
          # Priority: Manual Dispatch Input -> Tag Push (release) -> Branch Push (debug)
          RAW_TYPE="${{ github.event.inputs.build_type }}"
          if [ -n "$RAW_TYPE" ]; then
            BUILD_TYPE="$RAW_TYPE"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            BUILD_TYPE="release"
          else
            BUILD_TYPE="${RAW_TYPE:-debug}"
          fi

          echo "=========================================="
          echo "Target Build Type: $BUILD_TYPE"
          echo "=========================================="

          # Safe environment variable handling to avoid "Cannot convert '' to File"
          SECRET_KEYSTORE="${{ secrets.KEYSTORE_PATH }}"
          if [ -n "$SECRET_KEYSTORE" ] && [ -f "$SECRET_KEYSTORE" ]; then
            export KEYSTORE_PATH="$SECRET_KEYSTORE"
          else
            export KEYSTORE_PATH="$GITHUB_WORKSPACE/my-upload-key.jks"
          fi

          SECRET_STORE_PASS="${{ secrets.STORE_PASSWORD }}"
          export STORE_PASSWORD="${SECRET_STORE_PASS:-android}"

          SECRET_KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          export KEY_PASSWORD="${SECRET_KEY_PASS:-android}"

          # Execute build task based on build_type
          case "$BUILD_TYPE" in
            "debug")
              echo "Assembling debug APK..."
              ./gradlew :app:assembleDebug --stacktrace
              ;;
            "release")
              echo "Assembling release APK..."
              ./gradlew :app:assembleRelease --stacktrace
              ;;
            "both")
              echo "Assembling both debug and release APKs..."
              ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
              ;;
            *)
              echo "Unknown build_type: $BUILD_TYPE, defaulting to assembleDebug..."
              ./gradlew :app:assembleDebug --stacktrace
              ;;
          esac

      - name: List Generated APKs
        run: |
          echo "Listing all generated APK files:"
          if [ -d "app/build/outputs/apk" ]; then
            find app/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} +
          else
            echo "::error::No APK directory found after build step."
            exit 1
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alphapulse-apks-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

  # =========================================================================
  # JOB 3: Automatic GitHub Release (Triggers only on pushed tags, e.g. v1.0.0)
  # =========================================================================
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: alphapulse-apks-${{ github.sha }}
          path: release-apks

      - name: Publish Release with APK Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/**/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
