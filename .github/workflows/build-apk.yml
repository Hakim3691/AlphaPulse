name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        type: choice
        default: 'debug'
        options:
          - debug
          - release
          - both
      run_tests:
        description: 'Run Unit & Robolectric Tests'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 0: Repository Integrity Guard
  # =========================================================================
  # Stops the specific damage that once produced hundreds of misleading
  # "conflicting overloads" errors: duplicate declarations, conflict markers,
  # backup files, sources without a package line, and a traceability matrix
  # that no longer covers the whole specification. Cheap, so it runs first.
  integrity:
    name: Repository Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Integrity Checks
        run: python3 scripts/check_integrity.py

  # =========================================================================
  # JOB 1: Test Suite (Gating matrix)
  # =========================================================================
  test:
    name: Unit Tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
    strategy:
      fail-fast: true
      matrix:
        api-level: [33, 34]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Gradle Memory & Performance Options
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' >> ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
          org.gradle.parallel=true
          org.gradle.configuration-cache=true
          EOF

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd975f78077227923285f433e6574f90f169b7f16\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses || true

      - name: Provision Secrets & Keystores (Test Environment)
        run: |
          if [ ! -f .env ]; then
            [ -f .env.example ] && cp .env.example .env || touch .env
          fi
          chmod +x gradlew

          if [ ! -s debug.keystore ]; then
            if [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            fi
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug, O=Android, C=US"
          fi

          if [ ! -s my-upload-key.jks ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Alpha Pulse, OU=Engineering, O=Alpha Pulse, L=Mountain View, ST=CA, C=US"
          fi

      - name: Restore the bundled Needle 3 weights
        # The asset-presence spec hashes the real checkpoint, so this job must
        # produce it too. Cached under the pinned artifact digest, so the 35 MB
        # download happens once instead of once per matrix leg.
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/needle3.cact
          key: needle3-weights-c9d915ec-v1

      - name: Bundle the Needle 3 weights for the asset-presence spec
        # Same task the build job runs, so the test job verifies the exact bytes
        # that will be packaged rather than a cached copy of something else.
        run: ./gradlew :app:bundleNeedle3Weights --console=plain

      - name: Execute Unit & Robolectric Tests
        run: |
          echo "Running unit & Robolectric tests (API Level: ${{ matrix.api-level }})..."
          # Log output simultaneously to console and local test log file
          ./gradlew :app:testDebugUnitTest --continue -Ptest.api.level=${{ matrix.api-level }} --stacktrace 2>&1 | tee test-output.log

      - name: Surface Detailed Failures in Summary & Annotations
        if: failure()
        run: |
          python3 - << 'EOF'
          import os, glob, re, xml.etree.ElementTree as ET

          summary_path = os.getenv("GITHUB_STEP_SUMMARY")
          workspace = os.getenv("GITHUB_WORKSPACE", "")

          errors_found = False
          output_md = []

          # -------------------------------------------------------------
          # 1. Parse Kotlin/Java Compiler Errors from console output
          # -------------------------------------------------------------
          compiler_errors = []
          if os.path.isfile("test-output.log"):
              with open("test-output.log", "r", encoding="utf-8", errors="ignore") as f:
                  for line in f:
                      m = re.match(r"^e:\s+(?:file://)?([^:]+):(\d+):(\d+)\s+(.+)$", line.strip())
                      if m:
                          full_path, line_no, col_no, msg = m.groups()
                          rel_path = os.path.relpath(full_path, workspace) if full_path.startswith(workspace) else full_path
                          compiler_errors.append((rel_path, line_no, col_no, msg))
                          # Emit GitHub Annotation for file/line highlighting
                          print(f"::error file={rel_path},line={line_no},col={col_no},title=Compiler Error::{msg}")

          if compiler_errors:
              errors_found = True
              output_md.append("### 🚨 Compilation Errors\n")
              output_md.append("| File | Line | Col | Message |")
              output_md.append("| :--- | :--- | :--- | :--- |")
              for path, line_no, col_no, msg in compiler_errors:
                  output_md.append(f"| `{path}` | **{line_no}** | {col_no} | `{msg}` |")
              output_md.append("\n")

          # -------------------------------------------------------------
          # 2. Parse Unit Test Failures from JUnit XML reports
          # -------------------------------------------------------------
          test_xmls = glob.glob("app/build/**/test-results/**/*.xml", recursive=True)
          test_failures = []

          for xml_file in test_xmls:
              try:
                  tree = ET.parse(xml_file)
                  root = tree.getroot()
                  for testcase in root.findall(".//testcase"):
                      failure = testcase.find("failure")
                      if failure is None:
                          failure = testcase.find("error")
                      if failure is not None:
                          cls = testcase.attrib.get("classname", "UnknownClass")
                          name = testcase.attrib.get("name", "UnknownTest")
                          msg = failure.attrib.get("message", "Test assertion failed")
                          stack = failure.text or ""

                          # Extract file and line number from stacktrace
                          match = re.search(r"at ([\w\.]+)\(([\w]+\.kt):(\d+)\)", stack)
                          file_ref = match.group(2) if match else "Unknown"
                          line_ref = match.group(3) if match else "N/A"

                          test_failures.append((cls, name, file_ref, line_ref, msg))
                          print(f"::error title=Test Failed: {cls}.{name}::{msg} (at {file_ref}:{line_ref})")
              except Exception:
                  pass

          if test_failures:
              errors_found = True
              output_md.append("### ❌ Failed Unit Tests\n")
              output_md.append("| Test Class | Test Method | Source Ref | Failure Message |")
              output_md.append("| :--- | :--- | :--- | :--- |")
              for cls, name, f_ref, l_ref, msg in test_failures:
                  clean_msg = msg.replace("\n", " ").replace("|", "/")[:120]
                  output_md.append(f"| `{cls.split('.')[-1]}` | **`{name}`** | `{f_ref}:{l_ref}` | {clean_msg} |")
              output_md.append("\n")

          if not errors_found:
              output_md.append("### ⚠️ Task Failure\n")
              output_md.append("Execution failed during Gradle configuration or setup. Inspect raw step logs for details.\n")

          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("\n".join(output_md))
          EOF

      - name: Compile Instrumented Test Sources
        # Those tests need a device to *run*, but compiling them here means
        # they can never silently rot between emulator runs.
        run: ./gradlew :app:compileDebugAndroidTestKotlin --console=plain

      - name: Measure Coverage (JaCoCo) and Enforce the Baseline
        if: always()
        continue-on-error: true
        run: |
          # report + gate are separate so the HTML/CSV report is uploaded even
          # when the gate fails - a regression should be visible, not opaque.
          ./gradlew :app:jacocoTestReport :app:jacocoCoverageGate --console=plain 2>&1 | tee coverage-output.log

          python3 - << 'EOF'
          import csv, os

          path = "app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.csv"
          if not os.path.isfile(path):
              print("::warning title=Coverage::No JaCoCo CSV produced; coverage not measured.")
              raise SystemExit(0)

          rows = list(csv.DictReader(open(path)))
          covered = sum(int(r["LINE_COVERED"]) for r in rows)
          missed = sum(int(r["LINE_MISSED"]) for r in rows)
          total = covered + missed
          pct = (100.0 * covered / total) if total else 0.0
          print(f"Unit-test line coverage: {covered}/{total} = {pct:.1f}%")

          summary = os.getenv("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write("\n### Coverage (unit tests)\n\n")
                  f.write(f"**{pct:.1f}%** of executable lines ({covered}/{total}).\n\n")
                  f.write("The `jacocoCoverageGate` task fails the run if domain-logic coverage drops below its recorded floor.\n")
          EOF

      - name: Upload Coverage Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api-${{ matrix.api-level }}-${{ github.sha }}
          path: app/build/reports/jacoco/jacocoTestReport/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Test Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-api-${{ matrix.api-level }}-${{ github.sha }}
          path: app/build/**/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 14

  # =========================================================================
  # JOB 2: Build & Package APK (Only runs if ALL test jobs succeed)
  # =========================================================================
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Gradle Memory & Performance Options
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' >> ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
          org.gradle.parallel=true
          org.gradle.configuration-cache=true
          EOF

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd975f78077227923285f433e6574f90f169b7f16\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses || true

      - name: Install the NDK & CMake for the vendored Cactus engine
        # The Needle 3 engine (§30) is a prebuilt static library per ABI, so this job
        # links it with CMake. Both tools are pinned to the versions the app's
        # build.gradle.kts declares, so a release does not depend on whatever the
        # runner image happens to carry that week.
        run: |
          # sdkmanager is not guaranteed to be on PATH on every runner image, so it
          # is located explicitly instead of assumed.
          if command -v sdkmanager > /dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found at $SDKMANAGER, so the engine cannot be linked."
            exit 1
          fi

          # The licenses the packages below need, accepted non-interactively.
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "ndk;27.0.12077973" "cmake;3.22.1"

          echo "Installed NDK:"; ls "$ANDROID_HOME/ndk"
          echo "Installed CMake:"; ls "$ANDROID_HOME/cmake"

          # Fail here, with a clear message, rather than inside the CMake build.
          test -d "$ANDROID_HOME/ndk/27.0.12077973" || {
            echo "::error::NDK 27.0.12077973 is missing after installation."; exit 1; }
          test -d "$ANDROID_HOME/cmake/3.22.1" || {
            echo "::error::CMake 3.22.1 is missing after installation."; exit 1; }

      - name: Restore the signing keystores
        # A constant cache key, deliberately not run-scoped: the same files must come
        # back on every run. A freshly generated key signs with a different
        # certificate, and Android then refuses an in-place update with
        # INSTALL_FAILED_UPDATE_INCOMPATIBLE and wipes the user's downloaded models.
        # The secrets below take precedence when they are configured.
        uses: actions/cache@v4
        with:
          path: |
            my-upload-key.jks
            debug.keystore
          key: alphapulse-signing-keystores-v1

      - name: Provision persistent signing keystores
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f .env ]; then
            [ -f .env.example ] && cp .env.example .env || touch .env
          fi
          chmod +x gradlew

          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "Release keystore restored from the KEYSTORE_BASE64 secret."
          fi
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "Debug keystore restored from the DEBUG_KEYSTORE_BASE64 secret."
          fi

          if [ ! -s my-upload-key.jks ]; then
            if [ -f my-upload-key.jks.base64 ] && [ -s my-upload-key.jks.base64 ]; then
              base64 -d my-upload-key.jks.base64 > my-upload-key.jks
            fi
          fi

          if [ ! -s my-upload-key.jks ]; then
            echo "::warning::No persistent release keystore found. Generating one for this run; the signing-keystores cache keeps it, so later runs sign with the same certificate. Add KEYSTORE_BASE64 to keep it across cache evictions."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Alpha Pulse, OU=Engineering, O=Alpha Pulse, L=Mountain View, ST=CA, C=US"
          fi

          if [ ! -s debug.keystore ]; then
            if [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            fi
          fi
          if [ ! -s debug.keystore ]; then
            echo "::warning::No persistent debug keystore found. Generating one for this run; the signing-keystores cache keeps it for later runs."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug, O=Android, C=US"
          fi

      - name: Report the signing certificate
        # The SHA-256 printed here must be identical on every build. If it changes,
        # installed APKs can no longer be updated in place, and this summary says so
        # before anyone tries to install over an existing app.
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          STORE_PASS="${RELEASE_STORE_PASSWORD:-android}"
          {
            echo ""
            echo "### Signing identity"
            echo ""
            echo "These certificate fingerprints must not change between builds; a change breaks in-place updates."
            echo ""
            echo '```'
            for keystore in my-upload-key.jks debug.keystore; do
              echo "== $keystore =="
              keytool -list -v -keystore "$keystore" -storepass "$STORE_PASS" 2>/dev/null \
                | grep -E "Alias name|SHA256:" || true
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Pre-bundle the Needle 3 weights
        # The checkpoint is static and published, so it is fetched and verified at
        # build time and packaged uncompressed: the app then runs Needle 3 with no
        # runtime download and no inflate step. The Gradle task checks the pinned
        # size and SHA-256, so a truncated or tampered file fails the build.
        run: |
          ./gradlew :app:bundleNeedle3Weights --console=plain

          test -s app/src/main/assets/needle3.cact || {
            echo "::error::Needle 3 weights were not bundled into the APK assets."
            exit 1
          }
          echo "Bundled weights:"
          ls -lh app/src/main/assets/needle3.cact
          sha256sum app/src/main/assets/needle3.cact

      - name: Build APK Packages
        env:
          # app/build.gradle.kts stamps versionCode/versionName from these so
          # every released APK is traceable to its run and commit.
          BUILD_NUMBER: ${{ github.run_number }}
          GIT_SHA: ${{ github.sha }}
        run: |
          RAW_TYPE="${{ github.event.inputs.build_type }}"
          if [ -n "$RAW_TYPE" ]; then
            BUILD_TYPE="$RAW_TYPE"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # A release attaches BOTH APKs (C-04). Building only the release
            # variant left every published release without the debug asset, and
            # the upload step's old "ignore" setting hid it.
            BUILD_TYPE="both"
          else
            BUILD_TYPE="${RAW_TYPE:-debug}"
          fi

          echo "Target Build Type: $BUILD_TYPE"

          SECRET_KEYSTORE="${{ secrets.KEYSTORE_PATH }}"
          if [ -n "$SECRET_KEYSTORE" ] && [ -f "$SECRET_KEYSTORE" ]; then
            export KEYSTORE_PATH="$SECRET_KEYSTORE"
          else
            export KEYSTORE_PATH="$GITHUB_WORKSPACE/my-upload-key.jks"
          fi

          SECRET_STORE_PASS="${{ secrets.STORE_PASSWORD }}"
          export STORE_PASSWORD="${SECRET_STORE_PASS:-android}"

          SECRET_KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          export KEY_PASSWORD="${SECRET_KEY_PASS:-android}"

          case "$BUILD_TYPE" in
            "debug")
              ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build-output.log
              ;;
            "release")
              ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee build-output.log
              ;;
            "both")
              ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace 2>&1 | tee build-output.log
              ;;
            *)
              ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build-output.log
              ;;
          esac

      - name: Surface Detailed Compilation Failures
        if: failure()
        run: |
          python3 - << 'EOF'
          import os, re

          summary_path = os.getenv("GITHUB_STEP_SUMMARY")
          workspace = os.getenv("GITHUB_WORKSPACE", "")
          compiler_errors = []

          if os.path.isfile("build-output.log"):
              with open("build-output.log", "r", encoding="utf-8", errors="ignore") as f:
                  for line in f:
                      m = re.match(r"^e:\s+(?:file://)?([^:]+):(\d+):(\d+)\s+(.+)$", line.strip())
                      if m:
                          full_path, line_no, col_no, msg = m.groups()
                          rel_path = os.path.relpath(full_path, workspace) if full_path.startswith(workspace) else full_path
                          compiler_errors.append((rel_path, line_no, col_no, msg))
                          print(f"::error file={rel_path},line={line_no},col={col_no},title=Build Compiler Error::{msg}")

          if compiler_errors and summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("### 🚨 Build Compilation Errors\n\n")
                  f.write("| File | Line | Col | Message |\n")
                  f.write("| :--- | :--- | :--- | :--- |\n")
                  for path, line_no, col_no, msg in compiler_errors:
                      f.write(f"| `{path}` | **{line_no}** | {col_no} | `{msg}` |\n")
                  f.write("\n")
          EOF

      - name: List and verify the generated APK
        run: |
          if [ ! -d "app/build/outputs/apk" ]; then
            echo "::error::No APK directory found after build step."
            exit 1
          fi

          find app/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} +

          # Only arm64-v8a is built. A second ABI appearing here means the Gradle
          # filter regressed, and uploading it would waste bandwidth on an APK the
          # engine cannot run.
          while IFS= read -r apk; do
            case "$apk" in
              *arm64-v8a*) ;;
              *) echo "::error::Unexpected ABI-specific APK: $apk"; exit 1 ;;
            esac
          done < <(find app/build/outputs/apk -type f -name "*.apk")

      - name: Verify the packaged Needle 3 weights
        # The pre-build task checked the asset on disk; this checks the APK a user
        # actually downloads. It fails on a missing entry, a compressed entry
        # (which cannot be mapped), a wrong size or a wrong digest.
        run: ./gradlew :app:verifyPackagedWeights --console=plain

      - name: Upload debug APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          # One artifact per build type, so only the APK that is needed is downloaded.
          name: alphapulse-arm64-v8a-debug
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          # A missing APK must fail the job, never ship a release with one asset.
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: alphapulse-arm64-v8a-release
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          # A missing APK must fail the job, never ship a release with one asset.
          if-no-files-found: error
          retention-days: 30

  # =========================================================================
  # JOB 3: Automatic GitHub Release (Triggers only on pushed tags, e.g. v1.0.0)
  # =========================================================================
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [integrity, build, model-artifacts]
    # !cancelled() is required so the job still evaluates when a needed job
    # failed or was skipped: instead of silently skipping the release, it runs
    # the guard below and fails with an explicit reason.
    #
    # Tags only. A branch push has no tag to publish, and
    # softprops/action-gh-release then fails with "GitHub Releases requires a
    # tag", which turned every ordinary push to main red after all of its gates
    # had already passed. Branch pushes are still fully built and tested above.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}

    steps:
      # A tag may only publish artifacts whose tests passed AND whose two
      # published ONNX graphs both executed and passed in this same run.
      - name: Refuse to publish unverified artifacts
        if: ${{ needs.integrity.result != 'success' || needs.build.result != 'success' || needs.model-artifacts.result != 'success' }}
        run: |
          echo "::error::Release blocked: integrity result '${{ needs.integrity.result }}', build result '${{ needs.build.result }}', model artifact verification result '${{ needs.model-artifacts.result }}'. A release requires a clean integrity check, a successful build, and both published ONNX graphs executed and passing in this run."
          exit 1

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download the arm64-v8a APK artifacts
        # Both per-build-type artifacts, merged flat; whichever build type ran is
        # what gets attached to the release.
        uses: actions/download-artifact@v4
        with:
          pattern: alphapulse-arm64-v8a-*
          merge-multiple: true
          path: release-apks

      - name: Require both arm64-v8a APKs before publishing
        # C-04 says the release carries the debug and the release APK. The download
        # step succeeds even when one artifact is absent, so the published release
        # was previously missing an asset without any job turning red.
        run: |
          missing=0
          for apk in app-arm64-v8a-debug.apk app-arm64-v8a-release.apk; do
            if [ ! -s "release-apks/$apk" ]; then
              echo "::error::The release is missing $apk. A release must attach both the debug and the release APK."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          ls -l release-apks

      - name: Publish Release with APK Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # JOB 4: Published model artifact contract (real network)
  # =========================================================================
  model-artifacts:
    name: Model Artifact Sources
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Advisory on branches and manual runs: a publishing-host outage must not
    # block shipping the APK. On a release tag this job becomes blocking, so a
    # tag can never publish unless both published ONNX graphs really executed.
    continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd975f78077227923285f433e6574f90f169b7f16\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          yes | sdkmanager --licenses || true

      - name: Verify pinned artifact sources
        env:
          VERIFY_ARTIFACT_NETWORK: "true"
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests "com.aistudio.alphapulse.data.model.ModelArtifactSourceContractTest" \
            --stacktrace

      - name: Execute published ONNX graphs (real inference)
        env:
          VERIFY_ARTIFACT_NETWORK: "true"
          # Downloads the 250 MB TimesFM artifact as well as Chronos.
          VERIFY_LARGE_MODEL: "true"
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests "com.aistudio.alphapulse.domain.ml.onnx.OnnxModelParityTest" \
            --stacktrace

      # A skipped parity case still exits 0, so assert the graphs really ran.
      - name: Assert both published graphs executed
        run: |
          python3 - << 'EOF'
          import glob, sys, xml.etree.ElementTree as ET

          reports = glob.glob(
              "app/build/test-results/testDebugUnitTest/TEST-*OnnxModelParityTest.xml"
          )
          if not reports:
              sys.exit("::error::No OnnxModelParityTest report was produced")

          root = ET.parse(reports[0]).getroot()
          tests = int(root.get("tests", 0))
          failures = int(root.get("failures", 0)) + int(root.get("errors", 0))
          skipped = int(root.get("skipped", 0))
          print(f"parity: {tests} tests, {failures} failed, {skipped} skipped")

          if skipped:
              sys.exit("::error::A published ONNX graph was skipped; both must execute")
          if tests < 2 or failures:
              sys.exit("::error::Published ONNX graphs did not both pass")
          EOF

      - name: Upload Contract Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-artifact-contract-${{ github.sha }}
          path: |
            app/build/test-results/testDebugUnitTest/TEST-*ModelArtifactSourceContractTest.xml
            app/build/test-results/testDebugUnitTest/TEST-*OnnxModelParityTest.xml
          if-no-files-found: ignore
          retention-days: 14
